<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블라인드 차트 라벨링</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#0e1117; color:#ddd; margin:0; padding:12px; }
  #progress { font-size:14px; color:#aaa; margin-bottom:6px; }
  #meta { font-size:13px; color:#888; margin-bottom:8px; }
  canvas { background:#161a23; border-radius:6px; display:block; width:100%; }
  #mainCanvas { height: 360px; }
  #volCanvas { height: 100px; margin-top:4px; }
  .panel { margin-bottom:14px; }
  .actions { display:flex; gap:10px; margin:14px 0; }
  button.act { flex:1; padding:14px; font-size:16px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; }
  #btnBuy { background:#1f8b4c; color:#fff; }
  #btnSell { background:#c0392b; color:#fff; }
  #btnHold { background:#444; color:#fff; }
  #btnAdd { background:#1f8b4c; color:#fff; }
  #btnStay { background:#444; color:#fff; }
  #btnClose { background:#b8860b; color:#fff; }
  .tagGroup { margin:8px 0; padding:8px; border:1px solid #2a2f3a; border-radius:6px; }
  .tagGroup h4 { margin:0 0 6px 0; font-size:13px; color:#9bb; }
  label.tag { display:inline-block; margin:3px 6px 3px 0; padding:5px 9px; border-radius:14px; background:#222831; cursor:pointer; font-size:13px; }
  label.tag input { margin-right:4px; }
  label.tag.checked { background:#3a5; color:#fff; }
  textarea#note { width:100%; box-sizing:border-box; background:#161a23; color:#ddd; border:1px solid #2a2f3a; border-radius:6px; padding:8px; font-size:13px; }
  #tagsBox { display:none; margin-top:10px; }
  #submitBtn { width:100%; padding:12px; margin-top:10px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
  #posPanel { display:none; margin:10px 0; padding:10px; background:#1b2030; border-radius:8px; font-size:14px; }
  #result { margin-top:14px; padding:10px; background:#1b2030; border-radius:8px; display:none; }
  #nextBtn { width:100%; padding:12px; margin-top:10px; background:#555; color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; display:none; }
  .err { color:#f55; }
  .sizeRow { margin:8px 0; font-size:13px; }
  .sizeRow input { width:80px; background:#161a23; color:#ddd; border:1px solid #2a2f3a; border-radius:6px; padding:6px; margin-left:6px; }
  #reduceBox { display:none; margin-top:10px; padding:8px; border:1px solid #2a2f3a; border-radius:6px; }
</style>
</head>
<body>
  <div id="progress">로딩 중...</div>
  <div id="meta"></div>

  <div class="panel">
    <canvas id="mainCanvas"></canvas>
    <canvas id="volCanvas"></canvas>
  </div>

  <div id="posPanel"></div>

  <div class="actions" id="entryActions">
    <button class="act" id="btnBuy">매수</button>
    <button class="act" id="btnSell">매도/공매도</button>
    <button class="act" id="btnHold">관망</button>
  </div>

  <div class="actions" id="stepActions" style="display:none;">
    <button class="act" id="btnAdd">추가매수/매도</button>
    <button class="act" id="btnReduce">부분정리</button>
    <button class="act" id="btnStay">관망(유지)</button>
    <button class="act" id="btnClose">전체정리</button>
  </div>

  <div id="tagsBox">
    <div class="sizeRow">진입 비중(상대값, 기본 1):
      <input type="number" id="sizeInput" value="1" min="0.01" step="0.1">
    </div>
    <div class="tagGroup">
      <h4>그룹 A — 가격 패턴</h4>
      <label class="tag"><input type="checkbox" value="A1">A1 5MA/100MA 추세상태</label>
      <label class="tag"><input type="checkbox" value="A2">A2 지지/저항 터치</label>
      <label class="tag"><input type="checkbox" value="A3">A3 캔들패턴</label>
      <label class="tag"><input type="checkbox" value="A4">A4 신고가/신저가 돌파</label>
      <label class="tag"><input type="checkbox" value="A5">A5 눌림목/되돌림</label>
      <label class="tag"><input type="checkbox" value="A6">A6 이격 과다</label>
    </div>
    <div class="tagGroup">
      <h4>그룹 B — 거래량/구조</h4>
      <label class="tag"><input type="checkbox" value="B1">B1 거래량 급증</label>
      <label class="tag"><input type="checkbox" value="B2">B2 거래량 고갈</label>
      <label class="tag"><input type="checkbox" value="B3">B3 매물대 근처</label>
      <label class="tag"><input type="checkbox" value="B4">B4 거래량-가격 다이버전스</label>
    </div>
    <div class="tagGroup">
      <h4>그룹 C — 차트 밖 판단</h4>
      <label class="tag"><input type="checkbox" value="C1">C1 시장 전체 분위기</label>
      <label class="tag"><input type="checkbox" value="C2">C2 종목 특유 뉴스/이벤트 감</label>
      <label class="tag"><input type="checkbox" value="C3">C3 펀딩/포지셔닝 감</label>
      <label class="tag"><input type="checkbox" value="C4">C4 기타(자유서술 필수)</label>
    </div>
    <textarea id="note" rows="2" placeholder="자유서술 한 줄(선택, C4 선택 시 필수)"></textarea>
    <button id="submitBtn">제출</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div id="reduceBox">
    <div class="sizeRow">정리할 비중(보유량 이하):
      <input type="number" id="reduceSizeInput" value="1" min="0.01" step="0.1">
    </div>
    <button id="reduceSubmitBtn">부분정리 제출</button>
    <div class="err" id="reduceErrMsg"></div>
  </div>

  <div id="result"></div>
  <button id="nextBtn">다음 차트</button>

<script>
let caseMeta = null;      // {id, tf, symbol, order, tLocal, warmup, display, h}
let visible = null;       // {times,highs,lows,closes,volumes} 누적 표시 데이터
let position = null;      // {direction, avgEntry, numLegs, unrealizedPct, mfe, mae} | null
let pendingTagAction = null; // "entry-buy" | "entry-sell" | "add"

function sma(arr, period) {
  const out = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= period) sum -= arr[i - period];
    if (i >= period - 1) out[i] = sum / period;
  }
  return out;
}

function fitCanvas(canvas) {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

function drawChart(data, entryIdx) {
  const n = data.closes.length;
  const mainCanvas = document.getElementById("mainCanvas");
  const volCanvas = document.getElementById("volCanvas");
  const { ctx, w, h } = fitCanvas(mainCanvas);
  const { ctx: vctx, w: vw, h: vh } = fitCanvas(volCanvas);

  const ma5 = sma(data.closes, 5);
  const ma100 = sma(data.closes, 100);

  const padL = 8, padR = 8, padT = 8, padB = 8;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const barW = plotW / n;

  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) {
    lo = Math.min(lo, data.lows[i]);
    hi = Math.max(hi, data.highs[i]);
  }
  const range = (hi - lo) || 1;
  const yOf = (price) => padT + plotH - ((price - lo) / range) * plotH;

  ctx.clearRect(0, 0, w, h);

  for (let i = 0; i < n; i++) {
    const x = padL + i * barW + barW / 2;
    const isFuture = entryIdx != null && i > entryIdx;
    const bullish = data.closes[i] >= (i > 0 ? data.closes[i - 1] : data.closes[i]);
    const color = isFuture ? (bullish ? "#3a8f6f" : "#a85050") : (bullish ? "#26a65b" : "#e74c3c");
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.globalAlpha = isFuture ? 0.6 : 1.0;
    ctx.beginPath();
    ctx.moveTo(x, yOf(data.highs[i]));
    ctx.lineTo(x, yOf(data.lows[i]));
    ctx.stroke();
    const bw = Math.max(1, barW * 0.6);
    const openApprox = i > 0 ? data.closes[i - 1] : data.closes[i];
    const yTop = yOf(Math.max(openApprox, data.closes[i]));
    const yBot = yOf(Math.min(openApprox, data.closes[i]));
    ctx.fillRect(x - bw / 2, yTop, bw, Math.max(1, yBot - yTop));
  }
  ctx.globalAlpha = 1.0;

  function drawLine(arr, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      const x = padL + i * barW + barW / 2;
      const y = yOf(arr[i]);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  drawLine(ma5, "#f5c542");
  drawLine(ma100, "#5b9dff");

  if (entryIdx != null && entryIdx < n - 1) {
    const x = padL + entryIdx * barW + barW;
    ctx.strokeStyle = "#fff";
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + plotH);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = "#f5c542"; ctx.fillRect(padL, 4, 10, 3);
  ctx.fillStyle = "#ccc"; ctx.font = "11px sans-serif"; ctx.fillText("5MA", padL + 14, 10);
  ctx.fillStyle = "#5b9dff"; ctx.fillRect(padL + 50, 4, 10, 3);
  ctx.fillStyle = "#ccc"; ctx.fillText("100MA", padL + 64, 10);

  vctx.clearRect(0, 0, vw, vh);
  let maxVol = 0;
  for (let i = 0; i < n; i++) maxVol = Math.max(maxVol, data.volumes[i] || 0);
  const vPlotH = vh - 8;
  for (let i = 0; i < n; i++) {
    const x = padL + i * barW + barW / 2;
    const isFuture = entryIdx != null && i > entryIdx;
    const bullish = data.closes[i] >= (i > 0 ? data.closes[i - 1] : data.closes[i]);
    vctx.fillStyle = isFuture ? "rgba(150,180,200,0.5)" : (bullish ? "rgba(38,166,91,0.8)" : "rgba(231,76,60,0.8)");
    const bh = maxVol > 0 ? (data.volumes[i] / maxVol) * vPlotH : 0;
    const bw = Math.max(1, barW * 0.6);
    vctx.fillRect(x - bw / 2, vh - 4 - bh, bw, bh);
  }
}

function resetTagsUI() {
  document.querySelectorAll('#tagsBox input[type=checkbox]').forEach(cb => { cb.checked = false; cb.parentElement.classList.remove("checked"); });
  document.getElementById("note").value = "";
  document.getElementById("errMsg").textContent = "";
}
document.querySelectorAll('#tagsBox input[type=checkbox]').forEach(cb => {
  cb.addEventListener("change", () => cb.parentElement.classList.toggle("checked", cb.checked));
});

function renderPosPanel() {
  const box = document.getElementById("posPanel");
  if (!position) { box.style.display = "none"; return; }
  box.style.display = "block";
  const dirLabel = position.direction === "buy" ? "매수(롱)" : "매도(숏)";
  const realizedLine = position.numExits
    ? `지금까지 부분정리 ${position.numExits}회 — 실현 수익률: <b style="color:${position.realizedSoFarPct >= 0 ? '#2ecc71' : '#e74c3c'}">${position.realizedSoFarPct.toFixed(3)}%</b><br>`
    : "";
  box.innerHTML = `
    <b>${dirLabel}</b> 포지션 진행 중 — 진입 ${position.numLegs}회(총 비중 ${position.totalEntrySize}), 평단가=${position.avgEntry.toFixed(6)}<br>
    보유 비중: ${position.openSize} / ${position.totalEntrySize}<br>
    ${realizedLine}
    남은 물량 미실현 수익률: <b style="color:${position.unrealizedPct >= 0 ? '#2ecc71' : '#e74c3c'}">${position.unrealizedPct.toFixed(3)}%</b>
    (MFE ${position.mfe.toFixed(3)}% / MAE ${position.mae.toFixed(3)}%)
  `;
}

async function loadNext() {
  document.getElementById("result").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("tagsBox").style.display = "none";
  document.getElementById("reduceBox").style.display = "none";
  document.getElementById("entryActions").style.display = "flex";
  document.getElementById("stepActions").style.display = "none";
  position = null;
  pendingTagAction = null;
  resetTagsUI();
  renderPosPanel();

  const res = await fetch("/api/next");
  const json = await res.json();
  if (json.done) {
    document.getElementById("progress").textContent = `완료! 총 ${json.total}개 중 ${json.completed}개 제출됨.`;
    document.getElementById("meta").textContent = "";
    document.getElementById("mainCanvas").style.display = "none";
    document.getElementById("volCanvas").style.display = "none";
    document.getElementById("entryActions").style.display = "none";
    return;
  }
  caseMeta = json.case;
  visible = { times: json.case.times, highs: json.case.highs, lows: json.case.lows, closes: json.case.closes, volumes: json.case.volumes };
  document.getElementById("progress").textContent = `진행 ${json.progress.completed + 1} / ${json.progress.total}`;
  document.getElementById("meta").textContent = `종목: ${caseMeta.symbol}  |  타임프레임: ${caseMeta.tf}  |  표시 구간: 최근 ${caseMeta.display}봉 (t까지)`;
  drawChart(visible, caseMeta.tLocal);
}

function showTagsFor(action) {
  pendingTagAction = action;
  document.getElementById("entryActions").style.display = "none";
  document.getElementById("stepActions").style.display = "none";
  document.getElementById("reduceBox").style.display = "none";
  document.getElementById("tagsBox").style.display = "block";
  resetTagsUI();
}

document.getElementById("btnBuy").onclick = () => showTagsFor("entry-buy");
document.getElementById("btnSell").onclick = () => showTagsFor("entry-sell");
document.getElementById("btnHold").onclick = async () => {
  const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "hold" }) });
  const json = await res.json();
  if (json.error) { document.getElementById("errMsg").textContent = json.error; return; }
  if (json.finalized) { showFinalResult(json.record); return; }
  // 관망 유지: 캔들 1개만 더 보고 다시 매수/매도/관망 판단
  visible.times.push(json.newBar.time);
  visible.highs.push(json.newBar.high);
  visible.lows.push(json.newBar.low);
  visible.closes.push(json.newBar.close);
  visible.volumes.push(json.newBar.volume);
  drawChart(visible, caseMeta.tLocal);
  document.getElementById("entryActions").style.display = "flex";
};

document.getElementById("btnAdd").onclick = () => showTagsFor("add");
document.getElementById("btnStay").onclick = async () => { await sendStep("hold"); };
document.getElementById("btnClose").onclick = async () => { await sendStep("close"); };
document.getElementById("btnReduce").onclick = () => {
  document.getElementById("entryActions").style.display = "none";
  document.getElementById("stepActions").style.display = "none";
  document.getElementById("tagsBox").style.display = "none";
  document.getElementById("reduceErrMsg").textContent = "";
  const box = document.getElementById("reduceBox");
  box.style.display = "block";
  if (position) document.getElementById("reduceSizeInput").max = position.openSize;
};

document.getElementById("submitBtn").onclick = async () => {
  const checked = Array.from(document.querySelectorAll('#tagsBox input[type=checkbox]:checked')).map(c => c.value);
  if (!checked.length) { document.getElementById("errMsg").textContent = "이유 태그를 1개 이상 선택하세요."; return; }
  const note = document.getElementById("note").value.trim();
  if (checked.includes("C4") && !note) { document.getElementById("errMsg").textContent = "C4(기타) 선택 시 자유서술이 필수입니다."; return; }
  const size = Number(document.getElementById("sizeInput").value);
  if (!size || size <= 0) { document.getElementById("errMsg").textContent = "진입 비중은 0보다 커야 합니다."; return; }

  document.getElementById("tagsBox").style.display = "none";

  if (pendingTagAction === "entry-buy" || pendingTagAction === "entry-sell") {
    const action = pendingTagAction === "entry-buy" ? "buy" : "sell";
    const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, tags: checked, note, size }) });
    const json = await res.json();
    handleStepResponse(json);
  } else if (pendingTagAction === "add") {
    await sendStep("add", checked, note, size);
  }
};

document.getElementById("reduceSubmitBtn").onclick = async () => {
  const size = Number(document.getElementById("reduceSizeInput").value);
  if (!size || size <= 0) { document.getElementById("reduceErrMsg").textContent = "정리할 비중은 0보다 커야 합니다."; return; }
  if (position && size > position.openSize + 1e-9) { document.getElementById("reduceErrMsg").textContent = `보유 비중(${position.openSize})보다 많이 정리할 수 없습니다.`; return; }
  document.getElementById("reduceErrMsg").textContent = "";
  document.getElementById("reduceBox").style.display = "none";
  await sendStep("reduce", [], "", size, true);
};

async function sendStep(choice, tags, note, size, wasReduce) {
  const body = { choice, tags: tags || [], note: note || "" };
  if (size != null) body.size = size;
  const res = await fetch("/api/step", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json();
  handleStepResponse(json, wasReduce);
}

function handleStepResponse(json, wasReduce) {
  if (json.error) {
    if (wasReduce) {
      document.getElementById("reduceErrMsg").textContent = json.error;
      document.getElementById("reduceBox").style.display = "block";
    } else {
      document.getElementById("errMsg").textContent = json.error;
      document.getElementById("tagsBox").style.display = "block";
    }
    return;
  }
  if (json.finalized) {
    showFinalResult(json.record, json.forcedClose || json.forcedAtEntry);
    return;
  }
  // 캔들 1개 추가 공개
  visible.times.push(json.newBar.time);
  visible.highs.push(json.newBar.high);
  visible.lows.push(json.newBar.low);
  visible.closes.push(json.newBar.close);
  visible.volumes.push(json.newBar.volume);
  position = json.position;
  drawChart(visible, caseMeta.tLocal);
  renderPosPanel();
  document.getElementById("entryActions").style.display = "none";
  document.getElementById("stepActions").style.display = "flex";
  document.getElementById("tagsBox").style.display = "none";
  document.getElementById("reduceBox").style.display = "none";
}

function showFinalResult(record, forced) {
  document.getElementById("entryActions").style.display = "none";
  document.getElementById("stepActions").style.display = "none";
  document.getElementById("tagsBox").style.display = "none";
  document.getElementById("reduceBox").style.display = "none";
  position = null;
  renderPosPanel();

  const resultBox = document.getElementById("result");
  resultBox.style.display = "block";
  if (record.action === "hold") {
    resultBox.innerHTML = `<b>관망</b> 선택 — 채점 대상 아님.`;
  } else {
    const exitsHtml = record.exits.map(e =>
      `진입대비 ${e.barOffset}봉째, 비중 ${e.size}, 가격 ${e.price.toFixed(6)} → ${e.retPct.toFixed(3)}%`
    ).join("<br>");
    resultBox.innerHTML = `
      <b>${record.action === "buy" ? "매수" : "매도"}</b> 거래 종료 (진입 ${record.numLegs}회/총비중 ${record.totalEntrySize}, 정리 ${record.numExits}회, 마지막 정리 ${record.exitBarOffset}봉째)${forced ? " — 데이터 구간 끝나 강제종료" : ""}<br>
      전체 가중평균 실현 수익률(수수료 차감 후): <b style="color:${record.retPct >= 0 ? '#2ecc71' : '#e74c3c'}">${record.retPct.toFixed(3)}%</b><br>
      MFE(최대유리): ${record.mfe.toFixed(3)}%  /  MAE(최대불리): ${record.mae.toFixed(3)}%<br>
      <div style="margin-top:6px;font-size:13px;color:#aaa;">${exitsHtml}</div>
    `;
  }
  document.getElementById("nextBtn").style.display = "block";
}

document.getElementById("nextBtn").onclick = loadNext;

loadNext();
</script>
</body>
</html>
