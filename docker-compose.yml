version: "3.9"

# 공통 설정 앵커
x-trader-base: &trader-base
  build:
    context: .
    dockerfile: Dockerfile
  image: edgex-trader:latest
  env_file: .env
  volumes:
    - trader_data:/app/data
    - trader_logs:/app/logs
    - trader_config:/app/config
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  # 자원 제한 (2 vCPU, 4GB RAM VPS 기준)
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 1800M
      reservations:
        cpus: "0.25"
        memory: 256M

services:
  # ── 실전 모드 ────────────────────────────────────────────────────────────────
  trader:
    <<: *trader-base
    container_name: edgex-trader
    command: ["--log-level", "INFO"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,time,sys; f='/app/trading.log'; sys.exit(0 if not os.path.exists(f) or time.time()-os.path.getmtime(f)<300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 드라이런 (테스트용 — profiles: dryrun 으로 격리) ─────────────────────────
  trader_dryrun:
    <<: *trader-base
    container_name: edgex-trader-dryrun
    restart: "no"
    command: ["--dry-run", "--log-level", "DEBUG"]
    profiles:
      - dryrun
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  trader_data:
    name: edgex-trader-data
  trader_logs:
    name: edgex-trader-logs
  trader_config:
    name: edgex-trader-config
